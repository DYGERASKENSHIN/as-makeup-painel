<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>as.makeup · painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--pk:#ec0a7e;--pk2:#fde4f1;--ink:#2a2a2a;--mut:#777;--bd:#eee;--ok:#18794e;--er:#c4162f}
*{box-sizing:border-box}
body{margin:0;font:14px Montserrat,system-ui,sans-serif;color:var(--ink);background:#faf6f8}
button,input,select{font:inherit}
.btn{background:var(--pk);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.o{background:#fff;color:var(--pk);border:1px solid var(--pk)}
input,select{padding:9px 11px;border:1px solid #ddd;border-radius:8px;background:#fff}
:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(236,10,126,.12)}
.logo{font-weight:700;font-size:26px;color:var(--pk);margin:0 0 4px}
.box p{color:var(--mut);margin:0 0 18px}
.box input{width:100%;margin-bottom:10px}
.box .btn{width:100%}
#lerr{color:var(--er);min-height:20px;margin-top:10px;font-size:13px}
/* app */
#app{display:none}
header{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.hd{max-width:1200px;margin:auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hd .logo{font-size:20px;margin:0}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:20px;cursor:pointer;color:var(--mut);font-weight:600}
nav button.on{background:var(--pk2);color:var(--pk)}
main{max-width:1200px;margin:auto;padding:20px 16px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.card{background:#fff;border-radius:12px;padding:14px 16px;border:1px solid var(--bd)}
.card span{color:var(--mut);font-size:12px}
.card b{display:block;font-size:24px;color:var(--pk);margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input[type=search]{flex:1;min-width:200px}
.tw{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;font-size:13px}
th{background:var(--pk2);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.sm{font-size:12px;color:var(--mut)}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:#eee}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg2 label,label{font-size:13px;font-weight:600}.fg2 input,.fg2 select{width:100%;margin-top:4px;box-sizing:border-box}@media(max-width:600px){.fg2{grid-template-columns:1fr}}
.empty{padding:30px;text-align:center;color:var(--mut)}
h2{font-size:17px;margin:0 0 12px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:20}#md[hidden]{display:none}.mb{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:400px}.mb h3{margin:0 0 6px}.mb input{width:100%;margin-top:10px;font-size:18px;text-align:center;letter-spacing:1px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:24px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media(max-width:600px){.hd{gap:8px}}
</style>
</head>
<body>

<section id="login">
  <div class="box" id="lf">
    <h1 class="logo">as.makeup</h1>
    <p>Painel da loja. Entre com a senha de administrador.</p>
    <input id="api" type="url" placeholder="Endereço do servidor (https://...)" aria-label="Endereço do servidor" hidden>
    <input id="tk" type="password" placeholder="Senha de administrador" autocomplete="current-password" aria-label="Senha de administrador">
    <button class="btn" type="button" id="lgo">Entrar</button>
    <div id="lerr" role="alert"></div>
  </div>
</section>

<div id="app">
<header><div class="hd">
  <h1 class="logo">as.makeup · painel</h1>
  <nav id="nav">
    <button data-t="res" class="on">Resumo</button>
    <button data-t="ped">Pedidos</button>
    <button data-t="cli">Clientes</button>
    <button data-t="tro">Trocas</button>
    <button data-t="prd">Produtos</button>
    <button data-t="rev">Avaliações</button>
  </nav>
  <button class="btn o" id="rf">Atualizar</button>
  <button class="btn o" id="out">Sair</button>
</div></header>
<main>
  <div id="res"></div>
  <div id="ped" hidden></div>
  <div id="cli" hidden></div>
  <div id="tro" hidden></div>
  <div id="prd" hidden></div>
  <div id="rev" hidden></div>
</main>
</div>
<div id="md" hidden><div class="mb" role="dialog" aria-modal="true"><h3 id="mt"></h3><p id="mp" class="sm"></p><input id="mv" readonly hidden><div class="bar" style="margin:14px 0 0;justify-content:flex-end"><button class="btn o" id="mn">Fechar</button><button class="btn" id="my"></button></div></div></div>
<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const D=v=>new Date(v).toLocaleString("pt-BR");
const ss={get:k=>{try{return sessionStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let API=(window.ASMK_API||ls.get("asmk_painel_api")||"").replace(/\/+$/,"");
let T=ss.get("adm"),DATA={orders:[],users:[],returns:[],products:[],cats:[],tags:[],reviews:[],sum:{},stO:[],stR:[]};
if(!API)$("api").hidden=false;

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)}
async function api(p,o={}){
  let r;
  try{r=await fetch(API+p,{...o,headers:{"X-Admin-Token":T,"Content-Type":"application/json"}})}
  catch(e){throw new Error("Não consegui falar com o servidor. Confira o endereço e se o servidor está no ar.")}
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}
    const er=new Error(j.error||("Erro "+r.status));er.status=r.status;throw er}
  return r}
const J=async p=>(await api(p)).json();

async function load(){
  const [s,o,u,r,pr,rv]=await Promise.all([J("/api/admin/summary"),J("/api/admin/orders"),J("/api/admin/users"),J("/api/admin/returns"),J("/api/admin/products"),J("/api/admin/reviews")]);
  DATA={sum:s,orders:o.orders,stO:o.status,users:u.users,returns:r.returns,stR:r.status,products:pr.products,cats:pr.categorias,tags:pr.tags,reviews:rv.reviews};
  renderAll()}

function renderAll(){rRes();rPed();rCli();rTro();rPrd();rRev()}

function rRes(){
  const s=DATA.sum,pend=DATA.orders.filter(o=>o.st==="Aguardando pagamento").length;
  const ticket=s.pagos?s.faturado/s.pagos:0;
  const last=DATA.orders.slice(0,5);
  $("res").innerHTML=`<div class="cards">${[["Faturado (pago)",R(s.faturado)],["Pedidos",s.pedidos],["Pedidos pagos",s.pagos],["Aguardando pagamento",pend],["Ticket médio",R(ticket)],["Clientes cadastrados",s.clientes],["Trocas em aberto",s.trocas_abertas],["Inscritos nas novidades",s.novidades]].map(a=>`<div class="card"><span>${a[0]}</span><b>${a[1]}</b></div>`).join("")}</div>
  <h2>Últimos pedidos</h2>
  <div class="tw"><table><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Status</th></tr>${last.length?last.map(x=>`<tr><td><b>#${x.id}</b><div class="sm">${esc(D(x.d))}</div></td><td>${esc(x.nome)}</td><td>${R(x.t)}</td><td><span class="tag">${esc(x.st)}</span></td></tr>`).join(""):""}</table>${last.length?"":'<div class="empty">Ainda não há pedidos.</div>'}</div>
  <div class="bar" style="margin-top:16px"><button class="btn o" data-csv="pedidos">Baixar pedidos (CSV)</button><button class="btn o" data-csv="clientes">Baixar clientes (CSV)</button><button class="btn o" data-csv="novidades">Baixar inscritos (CSV)</button></div>`}

function rPed(){
  const q=($("pq")?.value||"").toLowerCase(),f=$("pf")?.value||"";
  const L=DATA.orders.filter(o=>(!f||o.st===f)&&(!q||[o.id,o.nome,o.email,o.tel].join(" ").toLowerCase().includes(q)));
  const keep=document.activeElement&&document.activeElement.id==="pq";
  $("ped").innerHTML=`<div class="bar"><input id="pq" type="search" placeholder="Buscar por nº, nome, e-mail ou telefone" value="${esc(q)}"><select id="pf"><option value="">Todos os status</option>${DATA.stO.map(s=>`<option${s===f?" selected":""}>${esc(s)}</option>`).join("")}</select><button class="btn o" data-csv="pedidos">Baixar CSV</button></div>
  <div class="tw"><table><tr><th>Pedido</th><th>Cliente</th><th>Itens</th><th>Entrega</th><th>Total</th><th>Status</th></tr>${L.map(x=>`<tr><td><b>#${x.id}</b><div class="sm">${esc(D(x.d))}<br>${esc(x.pg)}</div></td><td>${esc(x.nome)}<div class="sm">${esc(x.email)}<br>${esc(x.tel)}</div></td><td>${x.it.map(i=>esc(i.q)+"× "+esc(i.n)).join("<br>")}</td><td class="sm">${esc(x.addr.rua)}, ${esc(x.addr.numero)} ${esc(x.addr.complemento||"")}<br>${esc(x.addr.bairro)} · ${esc(x.addr.cidade)}/${esc(x.addr.uf)}<br>CEP ${esc(x.addr.cep)}</td><td>${R(x.t)}<div class="sm">frete ${R(x.frete)}${x.desconto?"<br>cupom −"+R(x.desconto):""}</div></td><td><select data-o="${x.id}">${DATA.stO.map(s=>`<option${s===x.st?" selected":""}>${esc(s)}</option>`).join("")}</select></td></tr>`).join("")}</table>${L.length?"":'<div class="empty">Nenhum pedido encontrado.</div>'}</div>`;
  if(keep){const e=$("pq");e.focus();e.setSelectionRange(e.value.length,e.value.length)}}

function rCli(){
  const L=DATA.users;
  $("cli").innerHTML=`<div class="bar"><span class="sm">As senhas ficam embaralhadas no banco: ninguém consegue ver, nem você. Se uma cliente esquecer a dela, gere uma senha provisória e envie para ela.</span><button class="btn o" data-csv="clientes">Baixar CSV</button></div>
  <div class="tw"><table><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Conta criada em</th><th>Pedidos</th><th>Senha</th></tr>${L.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.email)}</td><td>${esc(x.tel)}</td><td class="sm">${esc(new Date(x.d).toLocaleDateString("pt-BR"))}</td><td>${esc(x.pedidos)}</td><td><button class="btn o" data-rst="${esc(x.email)}">Gerar senha nova</button></td></tr>`).join("")}</table>${L.length?"":'<div class="empty">Ainda não há contas.</div>'}</div>`}

function rTro(){
  const L=DATA.returns;
  $("tro").innerHTML=`<div class="tw"><table><tr><th>Protocolo</th><th>Pedido</th><th>Cliente</th><th>Solicitação</th><th>Status</th></tr>${L.map(x=>`<tr><td><b>${esc(x.id)}</b><div class="sm">${esc(D(x.d))}</div></td><td>#${esc(x.pedido)}</td><td>${esc(x.email)}</td><td>${esc(x.tipo)} · ${esc(x.motivo)}<div class="sm">${x.it.map(i=>esc(i.q)+"× "+esc(i.n)).join("; ")}<br>${esc(x.descr)}</div></td><td><select data-r="${esc(x.id)}">${DATA.stR.map(s=>`<option${s===x.st?" selected":""}>${esc(s)}</option>`).join("")}</select></td></tr>`).join("")}</table>${L.length?"":'<div class="empty">Nenhuma troca ou devolução.</div>'}</div>`}

function ask(t,p,okTxt,fn,val){$("mt").textContent=t;$("mp").textContent=p;const v=$("mv");v.hidden=val==null;v.value=val||"";$("my").textContent=okTxt;$("md").hidden=false;
  $("mn").textContent=fn?"Cancelar":"Fechar";
  $("mn").onclick=()=>{$("md").hidden=true};
  $("my").onclick=async()=>{if(fn){$("md").hidden=true;fn();return}
    v.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}
    try{if(!ok&&navigator.clipboard){await navigator.clipboard.writeText(val);ok=true}}catch(e){}
    $("my").textContent=ok?"Copiada ✓":"Selecionada: use Ctrl+C"}}
let EDIT=null,PHOTO="";
const isrc=u=>/^(data:|https?:)/.test(u||"")?u:API+(u||"");
const brl=v=>v==null||v===""?"":String(v).replace(".",",");
function rPrd(){
  if(EDIT){const x=EDIT,vs=x.v&&x.v.length?x.v:[];
    $("prd").innerHTML=`<div class="tw" style="padding:18px;max-width:720px"><h2>${x.id?"Editar produto":"Novo produto"}</h2>
    <div class="fg2">
      <label>Nome do produto<input id="fn" maxlength="80" value="${esc(x.n||"")}"></label>
      <label>Categoria<select id="fc">${DATA.cats.map(c=>`<option${c===x.c?" selected":""}>${esc(c)}</option>`).join("")}</select></label>
      <label>Preço (R$)<input id="fp" inputmode="decimal" placeholder="29,90" value="${esc(brl(x.p))}"></label>
      <label>Preço antigo (opcional, para mostrar desconto)<input id="fo" inputmode="decimal" placeholder="39,90" value="${esc(x.o?brl(x.o):"")}"></label>
      <label>Estoque (deixe vazio para não controlar)<input id="fe" inputmode="numeric" placeholder="ex.: 24" value="${x.e==null?"":esc(x.e)}"></label>
      <label>Etiqueta<select id="ft">${DATA.tags.map(t=>`<option value="${esc(t)}"${t===(x.tag||"")?" selected":""}>${t||"nenhuma"}</option>`).join("")}</select></label>
    </div>
    <label style="display:block;margin-top:10px">Descrição curta<textarea id="fd" maxlength="300" rows="2" style="width:100%;font:inherit;padding:9px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box">${esc(x.d||"")}</textarea></label>
    <div style="margin-top:12px"><b>Cores ou tons</b> <span class="sm">(deixe sem nada se o produto tem uma opção só)</span>
      <div id="fv">${vs.map(v=>vrow(v[0],v[1])).join("")}</div><button class="btn o" type="button" data-vadd style="margin-top:6px">+ Adicionar cor</button></div>
    <div style="margin-top:14px"><b>Foto</b> <span class="sm">(de preferência com fundo branco e o produto bem visível; fica quadrada)</span>
      <div style="display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap"><img id="fprev" alt="" src="${esc(PHOTO||isrc(x.img))}" style="width:110px;height:110px;object-fit:contain;border:1px solid #eee;border-radius:10px;background:#fff${PHOTO||x.img?"":";display:none"}"><input type="file" id="ff" accept="image/*"></div><div class="sm" id="fpm"></div></div>
    <div class="msg" id="fmsg" style="color:var(--er);min-height:20px;margin-top:8px"></div>
    <div class="bar" style="margin:6px 0 0"><button class="btn" type="button" data-psave>Salvar produto</button><button class="btn o" type="button" data-pcancel>Cancelar</button></div></div>`;return}
  const L=DATA.products;
  $("prd").innerHTML=`<div class="bar"><button class="btn" type="button" data-pnew>+ Novo produto</button><span class="sm">${L.length} produto${L.length===1?"":"s"}. Mudanças aparecem na loja na hora.</span></div>
  <div class="tw"><table><tr><th></th><th>Produto</th><th>Preço</th><th>Estoque</th><th>Na loja</th><th></th></tr>${L.map(x=>`<tr style="${x.active?"":"opacity:.55"}"><td><img src="${esc(isrc(x.img))}" alt="" style="width:54px;height:54px;object-fit:contain;border-radius:8px;border:1px solid #eee;background:#fff"></td><td><b>${esc(x.n)}</b><div class="sm">${esc(x.c)}${x.tag?" · "+esc(x.tag):""}${x.v.length?" · "+x.v.length+" cores":""}</div></td><td>${R(x.p)}${x.o?`<div class="sm"><s>${R(x.o)}</s></div>`:""}</td><td>${x.e==null?'<span class="sm">sem controle</span>':x.e===0?'<span class="tag" style="background:#fde4e4;color:var(--er)">Esgotado</span>':x.e<=5?x.e+' <span class="tag" style="background:#fff3d6">Acabando</span>':x.e}</td><td>${x.active?"Visível":"Escondido"}</td><td style="white-space:nowrap"><button class="btn o" type="button" data-pedit="${x.id}">Editar</button> <button class="btn o" type="button" data-ptog="${x.id}">${x.active?"Esconder":"Mostrar"}</button> <button class="btn o" type="button" data-pdel="${x.id}">Apagar</button></td></tr>`).join("")}</table>${L.length?"":'<div class="empty">Nenhum produto ainda. Clique em Novo produto.</div>'}</div>`}
const vrow=(n,c)=>`<div class="vrow" style="display:flex;gap:8px;align-items:center;margin-top:6px"><input class="vn" maxlength="40" placeholder="Nome da cor (ex.: Coral)" value="${esc(n||"")}" style="flex:1"><input class="vc" type="color" value="${esc(c||"#cccccc")}" aria-label="Cor"><button class="btn o" type="button" data-vdel aria-label="Remover cor">✕</button></div>`;
function rRev(){
  const L=DATA.reviews;
  $("rev").innerHTML=`<p class="sm" style="margin-top:0">Só quem comprou (pedido pago) consegue avaliar, então todas são de clientes de verdade. Use "Esconder" apenas para ofensas ou spam: esconder avaliação ruim só porque é ruim engana quem compra.</p>
  <div class="tw"><table><tr><th>Produto</th><th>Cliente</th><th>Nota</th><th>Comentário</th><th>Na loja</th><th></th></tr>${L.map(x=>`<tr style="${x.visivel?"":"opacity:.55"}"><td>${esc(x.produto)}</td><td>${esc(x.nome)}<div class="sm">pedido #${esc(x.pedido)}<br>${esc(x.email)}<br>${esc(D(x.d))}</div></td><td><span style="color:#f5a623">${"★".repeat(x.nota)}${"☆".repeat(5-x.nota)}</span></td><td>${esc(x.t)||'<span class="sm">(sem texto)</span>'}</td><td>${x.visivel?"Visível":"Escondida"}</td><td style="white-space:nowrap"><button class="btn o" type="button" data-rvt="${x.id}" data-v="${x.visivel?0:1}">${x.visivel?"Esconder":"Mostrar"}</button> <button class="btn o" type="button" data-rvd="${x.id}">Apagar</button></td></tr>`).join("")}</table>${L.length?"":'<div class="empty">Ainda não há avaliações.</div>'}</div>`}
async function photoFrom(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>er(new Error("Não consegui abrir essa foto."));i.src=url});
    const c=document.createElement("canvas");c.width=c.height=480;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,480,480);
    const sc=Math.min(440/img.width,440/img.height),w=img.width*sc,h=img.height*sc;g.drawImage(img,(480-w)/2,(480-h)/2,w,h);
    let d=c.toDataURL("image/webp",.85);if(!d.startsWith("data:image/webp"))d=c.toDataURL("image/jpeg",.88);
    if(d.length>440000)d=c.toDataURL("image/jpeg",.7);return d}
  finally{URL.revokeObjectURL(url)}}
function show(){$("login").style.display="none";$("app").style.display="block"}
function hide(msg){$("app").style.display="none";$("login").style.display="grid";$("lerr").textContent=msg||""}

async function enter(){
  $("lerr").textContent="";
  try{await load();ss.set("adm",T);show()}
  catch(e){T="";ss.del("adm");hide(e.message)}}

function doLogin(){
  if(!API){const v=$("api").value.trim().replace(/\/+$/,"");if(!/^https?:\/\//.test(v)){$("lerr").textContent="Digite o endereço do servidor.";return}API=v;ls.set("asmk_painel_api",v)}
  if(!$("tk").value){$("lerr").textContent="Digite a senha.";return}
  T=$("tk").value;$("tk").value="";enter()}
$("lgo").onclick=doLogin;
$("lf").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doLogin()}});
$("out").onclick=()=>{T="";ss.del("adm");DATA.orders=[];DATA.users=[];hide("")};
$("rf").onclick=async()=>{try{await load();toast("Atualizado")}catch(e){toast(e.message)}};
$("nav").onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b===e.target));
  ["res","ped","cli","tro","prd","rev"].forEach(k=>$(k).hidden=k!==t)};
document.addEventListener("input",e=>{if(e.target.id==="pq")rPed()});
document.addEventListener("change",async e=>{if(e.target.id!=="ff"||!e.target.files[0])return;const m=$("fpm");m.textContent="Preparando a foto…";
  try{PHOTO=await photoFrom(e.target.files[0]);const im=$("fprev");im.src=PHOTO;im.style.display="";m.textContent="Foto pronta ("+Math.round(PHOTO.length*0.75/1024)+" KB)."}catch(er){m.textContent=er.message}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="pf"){rPed();return}
  try{
    if(t.dataset.o)await api("/api/admin/orders/"+t.dataset.o,{method:"PATCH",body:JSON.stringify({status:t.value})});
    else if(t.dataset.r)await api("/api/admin/returns/"+t.dataset.r,{method:"PATCH",body:JSON.stringify({status:t.value})});
    else return;
    toast("Salvo ✓");await load()}
  catch(x){toast(x.message)}});
document.addEventListener("click",async e=>{const sq=e.target.dataset&&e.target.dataset.sq;
  const pe=e.target.dataset;
  if("pnew" in pe){EDIT={v:[]};PHOTO="";rPrd();return}
  if(pe.pedit){const x=DATA.products.find(p=>p.id==pe.pedit);EDIT=JSON.parse(JSON.stringify(x));PHOTO="";rPrd();return}
  if("pcancel" in pe){EDIT=null;PHOTO="";rPrd();return}
  if("vadd" in pe){$("fv").insertAdjacentHTML("beforeend",vrow("","#cccccc"));return}
  if("vdel" in pe){e.target.closest(".vrow").remove();return}
  if(pe.ptog){const x=DATA.products.find(p=>p.id==pe.ptog);try{await api("/api/admin/products/"+x.id,{method:"PUT",body:JSON.stringify({active:!x.active})});toast(x.active?"Produto escondido":"Produto visível");await load()}catch(er){toast(er.message)}return}
  if(pe.pdel){const x=DATA.products.find(p=>p.id==pe.pdel);ask("Apagar "+x.n+"?","O produto sai da loja e as avaliações dele são apagadas. Os pedidos antigos continuam guardados. Para só tirar da loja por um tempo, use Esconder.","Apagar",async()=>{try{await api("/api/admin/products/"+x.id,{method:"DELETE"});toast("Produto apagado");await load()}catch(er){toast(er.message)}});return}
  if("psave" in pe){const m=$("fmsg");m.textContent="";
    const body={n:$("fn").value.trim(),c:$("fc").value,p:$("fp").value.trim(),o:$("fo").value.trim(),e:$("fe").value.trim(),tag:$("ft").value,d:$("fd").value.trim(),
      v:[...document.querySelectorAll("#fv .vrow")].map(r=>({n:r.querySelector(".vn").value.trim(),c:r.querySelector(".vc").value})).filter(v=>v.n)};
    if(PHOTO)body.img=PHOTO;
    try{if(EDIT.id)await api("/api/admin/products/"+EDIT.id,{method:"PUT",body:JSON.stringify(body)});else await api("/api/admin/products",{method:"POST",body:JSON.stringify(body)});
      EDIT=null;PHOTO="";toast("Produto salvo ✓");await load()}catch(er){m.textContent=er.message}return}
  if(pe.rvt){try{await api("/api/admin/reviews/"+pe.rvt,{method:"PATCH",body:JSON.stringify({visivel:pe.v==="1"})});await load()}catch(er){toast(er.message)}return}
  if(pe.rvd){ask("Apagar esta avaliação?","Isso não pode ser desfeito.","Apagar",async()=>{try{await api("/api/admin/reviews/"+pe.rvd,{method:"DELETE"});await load()}catch(er){toast(er.message)}});return}
  const r=e.target.dataset&&e.target.dataset.rst;
  if(r){ask("Gerar senha nova para "+r+"?","A senha antiga deixa de funcionar.","Gerar senha nova",async()=>{
      try{const j=await(await api("/api/admin/users/reset",{method:"POST",body:JSON.stringify({email:r})})).json();
        ask("Senha provisória de "+r,"Ela aparece só agora. Copie e envie para a cliente.","Copiar",null,j.senha)}catch(x){toast(x.message)}});return}
  const k=e.target.dataset&&e.target.dataset.csv;if(!k)return;
  try{const b=await(await api("/api/admin/export?tipo="+k)).blob(),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="as-makeup-"+k+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  catch(x){toast(x.message)}});

if(T&&API)enter();
</script>
</body>
</html>
