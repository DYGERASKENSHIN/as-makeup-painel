<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Loja</title><style>
:root{--bg:#15110e;--c:#221b16;--c2:#2d241d;--t:#f4ece3;--m:#a39485;--a:#f28a1f;--g:#6fcf97;--r:#eb5757}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif;padding:14px 14px 90px}
h1{font:800 26px/1.1 Impact,'Arial Narrow',sans-serif;letter-spacing:.5px}h2{font-size:17px;margin:16px 0 8px}
.card{background:var(--c);border-radius:14px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.card b{display:block}.m{color:var(--m);font-size:13px}.p{color:var(--a);font-weight:700;white-space:nowrap}
button,input,textarea,select{font:inherit;color:var(--t);background:var(--c2);border:0;border-radius:10px;padding:10px 12px;width:100%}
button{background:var(--a);color:#1a1209;font-weight:700;cursor:pointer;width:auto}button.s{background:var(--c2);color:var(--t)}button:disabled{opacity:.4}
input,textarea,select{margin:4px 0;display:block}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--m);font-size:11px;padding:10px 2px;border-radius:8px}nav button.on{color:var(--a)}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.chips button{white-space:nowrap;padding:7px 12px}
.big{font:800 30px Impact,sans-serif;color:var(--a)}img.qr{width:220px;background:#fff;padding:8px;border-radius:12px;display:block;margin:10px auto}
code{display:block;word-break:break-all;background:var(--c2);padding:8px;border-radius:8px;font-size:12px;margin:8px 0}.err{color:var(--r);margin:6px 0}.ok{color:var(--g)}

#sp{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#3a1f0a,#15110e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;transition:opacity .5s}
#sp img{width:170px;height:170px;border-radius:50%;box-shadow:0 0 60px #f28a1f88;animation:pu 1.4s ease-out}#sp p{margin-top:16px;letter-spacing:3px;color:var(--m);font-size:12px}
@keyframes pu{0%{transform:scale(.4) rotate(-12deg);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.hd{display:flex;align-items:center;gap:10px}.hd img{width:38px;height:38px;border-radius:50%}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kp div{background:var(--c);border-radius:14px;padding:12px}.kp b{font:800 22px Impact,sans-serif}
.up{color:var(--g)}.dn{color:var(--r)}.sg{display:flex;gap:6px;margin:8px 0}.sg button{flex:1;background:var(--c2);color:var(--t)}.sg button.on{background:var(--a);color:#1a1209}
svg text{fill:var(--m);font-size:9px}.bar{cursor:pointer;transition:opacity .2s}.bar:hover{opacity:.7}.tip{min-height:20px;color:var(--a);font-weight:700}
.tp{display:flex;justify-content:space-between;font-size:13px;margin:7px 0}.tb{height:6px;border-radius:3px;background:var(--a);margin-top:3px}</style></head><body><div id="sp"><img src="/logo" onerror="this.remove()"><p>CARREGANDO</p></div><div id="v"></div><nav id="nav"></nav><script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=s=>document.querySelector(s),brl=c=>'R$ '+(c/100).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+,)/g,'.');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,items=[],cart={},tab='shop',cat='Todos',q='',coupon=null,timer;
async function api(p,b,m){const r=await fetch('/api/'+p,{method:m||(b?'POST':'GET'),headers:{'X-Init-Data':tg.initData,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok){if(d.error=='gate')throw Error('gate');throw Error(d.error||'Erro');}return d}
const toast=m=>tg.showAlert?tg.showAlert(m):alert(m);
const go=t=>{clearInterval(timer);tab=t;draw()};
async function load(){me=await api('me');if(me.gate)return gate();const P=new URLSearchParams(location.search).get('tab');if(P=='tk')tab='tk';if(P=='tka'&&me.admin){tab='adm';aTab='tkt'}const c=await api('catalog');items=c.items;cart=c.cart;draw()}
function gate(){$('#nav').innerHTML='';$('#v').innerHTML=`<h1>Acesso restrito</h1><p class=m style="margin:10px 0">Entre no canal para comprar.</p><button onclick="tg.openTelegramLink('https://t.me/${me.channel.slice(1)}')">Entrar no canal</button> <button class=s onclick="load()">Já entrei</button>`}
function draw(){const tabs=[['shop','Loja'],['cart','Carrinho'+(Object.keys(cart).length?' ('+Object.keys(cart).length+')':'')],['wallet','Saldo'],['tk','Tickets'],['me','Perfil']];if(me.admin)tabs.push(['adm','Admin']);
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 ({shop,cart:cartV,wallet,me:prof,adm,tk})[tab]()}
function shop(){const cats=['Todos',...new Set(items.map(i=>i.cat))],list=items.filter(i=>(cat=='Todos'||i.cat==cat)&&i.name.toLowerCase().includes(q.toLowerCase()));
 $('#v').innerHTML=`<div class=hd><img src="/logo" onerror="this.remove()"><div><h1>${esc(me.store)}</h1><p class=m>Entrega automática após o pagamento.</p></div></div><input placeholder="Pesquisar serviço" value="${esc(q)}" oninput="q=this.value;shop();$('input').focus()">
 <div class=chips>${cats.map(c=>`<button class="${c==cat?'':'s'}" onclick="cat='${esc(c).replace(/'/g,'')}';shop()">${esc(c)}</button>`).join('')}</div>`+
 (list.map(i=>`<div class=card><div><b>${esc(i.name)}</b><span class=m>${i.stock==0?'Esgotado':i.stock<0?'Disponível':i.stock+' em estoque'}${i.desc?' · '+esc(i.desc):''}</span></div><div style="text-align:right"><div class=p>${brl(i.price)}</div><button ${i.stock==0?'disabled':''} onclick="add(${i.id})">${cart[i.id]?'+1 ('+cart[i.id]+')':'Comprar'}</button></div></div>`).join('')||'<p class=m>Nada encontrado.</p>')}
async function add(id){try{cart=(await api('cart',{op:'add',id})).cart;draw()}catch(e){toast(e.message)}}
function cartV(){const L=items.filter(i=>cart[i.id]);let sub=L.reduce((s,i)=>s+i.price*cart[i.id],0),d=coupon?Math.floor(sub*coupon.percent/100):0,tot=sub-d;
 if(!L.length){$('#v').innerHTML='<h1>Carrinho</h1><p class=m style="margin-top:10px">Vazio. Escolha algo na Loja.</p>';return}
 $('#v').innerHTML=`<h1>Carrinho</h1>`+L.map(i=>`<div class=card><div><b>${esc(i.name)}</b><span class=m>${cart[i.id]}x ${brl(i.price)}</span></div><button class=s onclick="rm(${i.id})">Remover</button></div>`).join('')+
 `<div class=row><input id=cp placeholder="Cupom" style="margin:0"><button class=s onclick="cpn()" style="flex:0 0 auto">Aplicar</button></div>${coupon?`<p class=ok>${coupon.code}: -${coupon.percent}%</p>`:''}
 <p style="margin:12px 0">Total <span class=big>${brl(tot)}</span></p><p class=m>Seu saldo: ${brl(me.bal+me.bonus)}</p><div class=row><button ${me.bal+me.bonus<tot?'disabled':''} onclick="pay('balance')">Pagar com saldo</button><button class=s onclick="pay('pix')">Pagar com Pix</button></div><div class=err id=e></div>`}
async function rm(id){cart=(await api('cart',{op:'rm',id})).cart;draw()}
async function cpn(){try{coupon=await api('coupon',{code:$('#cp').value});cartV()}catch(e){toast(e.message)}}
async function pay(method){try{const r=await api('checkout',{method,coupon:coupon&&coupon.code});coupon=null;cart={};
 if(r.status=='paid'){me=await api('me');return done('Pagamento confirmado! A entrega foi enviada no chat do bot.')}
 pixV('Pedido #'+r.id,r,()=>api('order/'+r.id),()=>api('order/'+r.id+'/cancel',{}),()=>done('Pagamento confirmado! A entrega foi enviada no chat do bot.'))}catch(e){toast(e.message)}}
function done(m){me&&api('me').then(x=>me=x);$('#v').innerHTML=`<h1 class=ok>Pronto!</h1><p style="margin:10px 0">${m}</p><button onclick="load().then(()=>go('shop'))">Voltar à loja</button>`}
function pixV(title,r,check,cancel,ok){$('#v').innerHTML=`<h1>${title}</h1><p class=m>Pague com Pix. A confirmação é automática.</p><img class=qr src="data:image/png;base64,${r.qr}"><code id=cd>${esc(r.code)}</code>
 <div class=row><button onclick="navigator.clipboard.writeText($('#cd').textContent);tg.HapticFeedback.notificationOccurred('success')">Copiar código</button><button class=s id=cn>Cancelar</button></div>`;
 $('#cn').onclick=async()=>{clearInterval(timer);await cancel();load().then(()=>go('shop'))};
 timer=setInterval(async()=>{try{if((await check()).status=='paid'){clearInterval(timer);ok()}}catch(e){}},4000)}
function wallet(){$('#v').innerHTML=`<h1>Saldo</h1><p class=big style="margin:8px 0">${brl(me.bal)}</p><p class=m>Bônus de indicação: ${brl(me.bonus)}</p><h2>Adicionar saldo</h2><input id=am inputmode=decimal placeholder="Valor (mín. ${brl(me.min_topup)})"><button onclick="topup()">Gerar Pix</button><h2>Resgatar gift</h2><input id=gc placeholder="Código do gift" autocapitalize=characters><button onclick="redeem()">Resgatar</button>`}
async function redeem(){try{const r=await api('redeem',{code:$('#gc').value});toast(r.msg);if(r.ok){me=await api('me');wallet()}}catch(e){toast(e.message)}}
async function topup(){try{const c=Math.round(parseFloat($('#am').value.replace(',','.'))*100);const r=await api('topup',{cents:c});
 pixV('Recarga #'+r.id,r,async()=>({status:(await api('topup/'+r.id)).status=='paid'?'paid':''}),()=>Promise.resolve(),()=>{done('Saldo adicionado!')})}catch(e){toast(e.message)}}
async function prof(){$('#v').innerHTML=`<h1>Perfil</h1><p class=m>ID ${me.id}</p><h2>Meus pedidos</h2>`;const o=await api('orders');
 $('#v').innerHTML+=(o.map(x=>`<div class=card><b>#${x.id}</b><span>${brl(x.total)}</span><span class=m>${x.status=='paid'?'pago':x.status=='pending'?'aguardando':'encerrado'}</span></div>`).join('')||'<p class=m>Nenhum pedido ainda.</p>')+(me.support?`<p style="margin-top:14px"><button class=s onclick="tg.openTelegramLink('https://t.me/${me.support.replace('@','')}')">Falar com o suporte</button></p>`:'')}

const sum=a=>a.reduce((x,y)=>x+y,0),pct=(a,b)=>b?Math.round((a-b)/b*100):(a?100:0);
const dl=(a,b,fmt=x=>x)=>{const p=pct(a,b);return `<span class="${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p)}%</span> <span class=m>vs semana anterior (${fmt(b)})</span>`};
function cnt(el,to,fmt){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);el.textContent=fmt(Math.round(to*(1-Math.pow(1-k,3))));k<1&&requestAnimationFrame(f)})(t0)}
function bars(data,fmt,days){const W=340,H=130,n=data.length,mx=Math.max(...data,1),bw=W/n;
 return `<svg viewBox="0 0 ${W} ${H+16}" width="100%">`+data.map((v,i)=>{const h=Math.max(2,v/mx*H),d=new Date((days-n+1+i)*864e5+432e5);
 return `<rect class=bar x="${i*bw+3}" y="${H-h}" width="${bw-6}" height="${h}" rx="4" fill="${i>=n/2?'#f28a1f':'#6b4a2b'}" onclick="$('#tip').textContent='${('0'+d.getUTCDate()).slice(-2)}/${('0'+(d.getUTCMonth()+1)).slice(-2)}: ${fmt(v)}'"/><text x="${i*bw+bw/2}" y="${H+12}" text-anchor="middle">${d.getUTCDate()}</text>`}).join('')+'</svg>'}
let aTab='res',aMet='rev',D;
async function adm(){D=D||await api('admin/dash');const d=await api('admin');drawAdm(d)}
function drawAdm(d){const t=D,M={rev:['Faturamento',brl,t.rev],cnt:['Vendas',x=>x,t.cnt],usr:['Clientes novos',x=>x,t.usr]},[nm,fmt,ser]=M[aMet],w1=sum(ser.slice(7)),w0=sum(ser.slice(0,7));
 const r1=sum(t.rev.slice(7)),r0=sum(t.rev.slice(0,7)),c1=sum(t.cnt.slice(7)),c0=sum(t.cnt.slice(0,7)),tk=c1?Math.round(r1/c1):0,tk0=c0?Math.round(r0/c0):0;
 let h=`<div class=hd><img src="/logo"><h1>Painel admin</h1></div><div class=sg>${[['res','Resumo'],['prod','Produtos'],['tkt','Tickets'],['new','Novo']].map(([k,l])=>`<button class="${aTab==k?'on':''}" onclick="aTab='${k}';drawAdm(window._d)">${l}</button>`).join('')}</div>`;window._d=d;
 if(aTab=='res')h+=`<div class=kp><div><span class=m>Faturamento 7 dias</span><br><b id=k1>0</b><br>${dl(r1,r0,brl)}</div><div><span class=m>Vendas 7 dias</span><br><b id=k2>0</b><br>${dl(c1,c0)}</div><div><span class=m>Ticket médio</span><br><b id=k3>0</b><br>${dl(tk,tk0,brl)}</div><div><span class=m>Clientes novos</span><br><b id=k4>0</b><br>${dl(sum(t.usr.slice(7)),sum(t.usr.slice(0,7)))}</div></div>
 <div class=sg>${Object.entries(M).map(([k,v])=>`<button class="${aMet==k?'on':''}" onclick="aMet='${k}';drawAdm(window._d)">${v[0]}</button>`).join('')}</div>
 <div class=card style="display:block"><b>${nm} · últimos 14 dias</b><span class=m> (laranja = esta semana)</span>${bars(ser,fmt,t.today)}<div class=tip id=tip>Toque numa barra</div><span class=m>Esta semana ${fmt(w1)} · anterior ${fmt(w0)}</span></div>
 <div class=card style="display:block"><b>Mais vendidos (7 dias)</b>${t.top.length?t.top.map(p=>`<div class=tp><span>${esc(p[0])} <span class=m>${p[1]}x</span></span><span class=p>${brl(p[2])}</span></div><div class=tb style="width:${Math.round(p[2]/t.top[0][2]*100)}%"></div>`).join(''):'<p class=m>Sem vendas ainda.</p>'}</div>
 <div class=card><div><b>Vendido no mês</b><span class=m>${t.month[0]} vendas</span></div><span class=p>${brl(t.month[1])}</span></div>
 <div class=card><div><b>Recargas (7 dias)</b></div><span class=p>${brl(t.topups7)}</span></div><div class=card><div><b>Total geral</b><span class=m>${d.stats.all[0]} vendas · ${d.stats.users} clientes</span></div><span class=p>${brl(d.stats.all[1])}</span></div><p style="margin-top:14px"><button class=s style="color:var(--r)" onclick="rst()">Zerar vendas e ranking</button></p>`;
 else if(aTab=='tkt'){h+='<div id=tl><p class=m>Carregando…</p></div>';api('admin/tickets').then(l=>$('#tl').innerHTML=tl(l))}
 else if(aTab=='new')h+=`<h2>Novo produto</h2><input id=n placeholder="Nome"><input id=pr placeholder="Preço (29,90)"><input id=ct placeholder="Categoria"><textarea id=st rows=4 placeholder="Estoque: uma unidade por linha (login:senha, chave, link)"></textarea><button onclick="newP()">Criar produto</button>`;
 else h+=d.products.map(p=>`<div class=card style="flex-wrap:wrap"><div><b>${esc(p.name)}</b><span class=m>${p.stock<0?'ilimitado':p.stock+' em estoque'} · ${p.on?'ativo':'desativado'}</span></div><div class=p>${brl(p.price)}</div><div class=row style="width:100%"><button class=s onclick="ed(${p.id},{on:${p.on?0:1}})">${p.on?'Desativar':'Ativar'}</button><button class=s onclick="pp(${p.id})">Preço</button><button class=s onclick="sk(${p.id})">+ Estoque</button><button class=s style="color:var(--r)" onclick="dp(${p.id})">Remover</button></div><div class=row style="width:100%"><button class=s onclick="en(${p.id})">Renomear</button><button class=s onclick="inf(${p.id},${p.stock<0?1:0})">${p.stock<0?'Limitar estoque':'Estoque infinito'}</button></div></div>`).join('')||'<p class=m>Nenhum produto.</p>';
 $('#v').innerHTML=h;if(aTab=='res'){cnt($('#k1'),r1,brl);cnt($('#k2'),c1,x=>x);cnt($('#k3'),tk,brl);cnt($('#k4'),sum(t.usr.slice(7)),x=>x)}}

const ago=s=>{const m=Math.floor((Date.now()/1e3-s)/60);return m<1?'agora':m<60?m+' min':m<1440?Math.floor(m/60)+' h':Math.floor(m/1440)+' d'};
const tl=l=>l.map(t=>`<div class=card onclick="thr(${t.id})" style="cursor:pointer"><div><b>#${t.id} ${esc(t.subject)}</b><span class=m>${t.user?'@'+esc(t.user)+' · ':''}${ago(t.upd)}</span></div><span class="${t.status=='open'?'up':'m'}">${t.status=='open'?'aberto':'fechado'}</span></div>`).join('')||'<p class=m>Nenhum ticket.</p>';
async function tk(){const l=await api('tickets');$('#v').innerHTML=`<h1>Tickets</h1><p class=m>Fale com o suporte. A resposta chega aqui e no chat do bot.</p><h2>Abrir ticket</h2><input id=ts maxlength=80 placeholder="Assunto (ex: login não funciona)"><textarea id=tm rows=4 maxlength=1500 placeholder="Descreva o problema e, se for de um pedido, o número dele"></textarea><button onclick="newT()">Abrir ticket</button><h2>Meus tickets</h2>`+tl(l)}
async function newT(){try{const r=await api('tickets',{subject:$('#ts').value,text:$('#tm').value});thr(r.id)}catch(e){toast(e.message)}}
async function thr(id){clearInterval(timer);const back=tab=='adm'?'adm':'tk';
 const fill=async()=>{const t=await api('tickets/'+id);$('#tt').textContent='#'+id+' '+t.subject;
  $('#ms').innerHTML=t.msgs.map(m=>`<div style="display:flex;justify-content:${m.me?'flex-end':'flex-start'}"><div style="max-width:82%;background:${m.me?'var(--a)':'var(--c2)'};color:${m.me?'#1a1209':'var(--t)'};padding:8px 12px;border-radius:14px;margin:4px 0;white-space:pre-wrap">${esc(m.text)}<div style="font-size:10px;opacity:.6">${m.admin?'Suporte':'Cliente'} · ${ago(m.t)}</div></div></div>`).join('');
  $('#cl').style.display=t.status=='open'?'':'none';$('#st').textContent=t.status=='open'?'Aberto':'Fechado — responda para reabrir'};
 $('#v').innerHTML=`<button class=s onclick="go('${back}')">← Voltar</button><h2 id=tt></h2><p class=m id=st></p><div id=ms></div><textarea id=rp rows=3 maxlength=1500 placeholder="Escreva sua mensagem"></textarea><div class=row><button onclick="rpl(${id})">Enviar</button><button class=s id=cl onclick="cls(${id})">Fechar ticket</button></div>`;
 await fill();timer=setInterval(()=>fill().catch(()=>{}),8000)}
async function rpl(id){try{await api('tickets/'+id+'/reply',{text:$('#rp').value});thr(id)}catch(e){toast(e.message)}}
async function cls(id){await api('tickets/'+id+'/close',{});go(tab=='adm'?'adm':'tk')}
setTimeout(()=>{const s=$('#sp');s.style.opacity=0;setTimeout(()=>s.remove(),500)},1600);
async function newP(){try{await api('admin/product',{name:$('#n').value,price:$('#pr').value,cat:$('#ct').value,stock:$('#st').value});toast('Produto criado.');D=null;await load();go('adm')}catch(e){toast(e.message)}}
async function ed(id,b){try{await api('admin/product/'+id,b);D=null;await load();go('adm')}catch(e){toast(e.message)}}
const rst=async()=>{if(!confirm('Zerar vendas, gráficos e ranking? Os pedidos dos clientes continuam salvos.'))return;try{await api('admin/reset',{});D=null;go('adm')}catch(e){toast(e.message)}},dp=async id=>{if(!confirm('Remover este produto? Não dá para desfazer.'))return;try{await api('admin/product/'+id+'/delete',{});D=null;await load();go('adm')}catch(e){toast(e.message)}},en=id=>{const v=prompt('Novo nome do produto');v&&ed(id,{name:v})},inf=(id,u)=>{if(u)return ed(id,{unlimited:0});const v=prompt('Texto ou link entregue a cada compra');v&&ed(id,{unlimited:1,text:v})},pp=id=>{const v=prompt('Novo preço (ex: 29,90)');v&&ed(id,{price:v})},sk=id=>{const v=prompt('Cole as unidades (separe com ; )');v&&ed(id,{stock:v.split(';').join('\n')})};
load().catch(e=>$('#v').innerHTML='<h1>Abra pelo bot</h1><p class=m>Este app só funciona dentro do Telegram.</p>');
</script></body></html>
